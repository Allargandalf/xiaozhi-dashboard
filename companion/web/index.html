<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>小智日程</title>
  <style>
    :root {
      color-scheme: light; font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      color: #27302d; background: #f7f3ea; font-synthesis: none;
      --bg:#f7f3ea; --surface:#fff; --border:#ded8cb; --text:#27302d; --secondary:#68736f; --muted:#99a09d;
      --green:#2f7d67; --green-soft:#e8f4ee; --blue:#3b6fa7; --blue-soft:#eaf1f8;
      --warm:#b8673e; --warm-soft:#f8ece3; --danger:#a6463c; --danger-soft:#f9e9e6;
      --shadow:0 18px 50px rgba(62,54,40,.08);
    }
    * { box-sizing:border-box; }
    body { margin:0; min-width:320px; min-height:100vh; background:var(--bg); }
    button,input,textarea { font:inherit; }
    button { border:0; cursor:pointer; }
    button:focus-visible,input:focus-visible,textarea:focus-visible { outline:3px solid rgba(47,125,103,.2); outline-offset:2px; }
    button:disabled { cursor:wait; opacity:.58; }
    h1,h2,h3,p { margin-top:0; }
    .app { min-height:100vh; display:grid; grid-template-columns:228px minmax(0,1fr); }
    .sidebar { min-height:100vh; padding:28px 20px 22px; display:flex; flex-direction:column; border-right:1px solid var(--border); background:rgba(255,255,255,.72); backdrop-filter:blur(18px); }
    .brand { display:flex; align-items:center; gap:12px; padding:0 8px; }
    .brand-mark { width:42px; height:42px; display:grid; place-items:center; border-radius:14px; background:var(--green); color:white; box-shadow:0 9px 24px rgba(47,125,103,.22); font-size:22px; font-weight:750; }
    .brand strong { display:block; font-size:17px; letter-spacing:.03em; }
    .brand small { color:var(--secondary); font-size:12px; }
    .nav-label { margin:40px 10px 10px; color:var(--muted); font-size:11px; letter-spacing:.14em; }
    .nav { display:grid; gap:6px; }
    .nav-button { width:100%; min-height:44px; padding:0 13px; display:flex; align-items:center; gap:11px; border-radius:12px; color:var(--secondary); background:transparent; text-align:left; font-weight:650; }
    .nav-button:hover { background:#f1eee7; color:var(--text); }
    .nav-button.active { color:var(--green); background:var(--green-soft); }
    .nav-icon { width:22px; font-size:17px; text-align:center; }
    .nav-count { margin-left:auto; min-width:24px; padding:2px 7px; border-radius:999px; background:rgba(255,255,255,.72); font-size:11px; text-align:center; }
    .sidebar-bottom { margin-top:auto; display:grid; gap:12px; }
    .connection-card { padding:13px; border:1px solid var(--border); border-radius:14px; background:var(--surface); }
    .connection-line { display:flex; align-items:center; gap:8px; font-size:12px; font-weight:700; }
    .connection-dot { width:8px; height:8px; border-radius:50%; background:var(--muted); }
    .connection-card.ready .connection-dot { background:var(--green); box-shadow:0 0 0 4px var(--green-soft); }
    .connection-card.error .connection-dot { background:var(--danger); box-shadow:0 0 0 4px var(--danger-soft); }
    .connection-card p { margin:7px 0 0 16px; color:var(--secondary); font-size:11px; line-height:1.55; }
    .main { min-width:0; padding:26px clamp(22px,3vw,46px) 48px; }
    .topbar { min-height:48px; display:flex; align-items:center; justify-content:space-between; gap:20px; }
    .date-nav { display:flex; align-items:center; gap:8px; }
    .icon-button,.today-button { height:40px; border:1px solid var(--border); border-radius:11px; background:var(--surface); color:var(--secondary); }
    .icon-button { width:40px; font-size:21px; }
    .icon-button:hover,.today-button:hover { border-color:#bbb5a8; color:var(--text); }
    .today-button { padding:0 14px; font-size:13px; font-weight:650; }
    .date-input-wrap { position:relative; }
    .date-input-wrap::before { content:"日期"; position:absolute; left:12px; top:5px; color:var(--muted); font-size:9px; pointer-events:none; }
    #date { width:154px; height:40px; padding:14px 10px 2px; border:1px solid var(--border); border-radius:11px; background:var(--surface); color:var(--text); font-size:13px; font-weight:650; }
    .primary-button { min-height:42px; padding:0 17px; border-radius:12px; background:var(--green); color:white; font-weight:700; box-shadow:0 8px 18px rgba(47,125,103,.16); }
    .primary-button:hover { background:#286d5a; transform:translateY(-1px); }
    .primary-button:active { transform:translateY(0); }
    .primary-button .plus { margin-right:6px; font-size:18px; }
    .hero { padding:36px 0 24px; display:flex; align-items:flex-end; justify-content:space-between; gap:20px; }
    .eyebrow { margin-bottom:7px; color:var(--green); font-size:12px; font-weight:750; letter-spacing:.08em; }
    .hero h1 { margin-bottom:7px; color:var(--text); font-size:clamp(28px,3vw,40px); line-height:1.12; letter-spacing:-.035em; }
    .hero p { margin-bottom:0; color:var(--secondary); font-size:14px; }
    .save-note { display:flex; align-items:center; gap:8px; color:var(--secondary); font-size:12px; white-space:nowrap; }
    .save-note svg { color:var(--green); }
    .notice { min-height:0; overflow:hidden; transition:.2s ease; }
    .notice:not(.visible) { height:0; }
    .notice-inner { margin-bottom:18px; padding:12px 14px; display:flex; align-items:center; gap:10px; border-radius:12px; font-size:13px; }
    .notice.loading .notice-inner { color:var(--blue); background:var(--blue-soft); }
    .notice.success .notice-inner { color:var(--green); background:var(--green-soft); }
    .notice.error .notice-inner { color:var(--danger); background:var(--danger-soft); }
    .notice-message { flex:1; }
    .retry-button { padding:5px 10px; border-radius:8px; color:inherit; background:rgba(255,255,255,.7); font-weight:700; }
    .spinner { width:14px; height:14px; display:block; border:2px solid currentColor; border-right-color:transparent; border-radius:50%; animation:spin .7s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .stats { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; margin-bottom:22px; }
    .stat-card { min-height:108px; padding:18px; display:flex; align-items:center; gap:14px; border:1px solid var(--border); border-radius:18px; background:var(--surface); box-shadow:0 8px 28px rgba(62,54,40,.035); }
    .stat-icon { width:46px; height:46px; flex:0 0 auto; display:grid; place-items:center; border-radius:14px; font-size:20px; }
    .stat-card.schedule .stat-icon { color:var(--green); background:var(--green-soft); }
    .stat-card.log .stat-icon { color:var(--warm); background:var(--warm-soft); }
    .stat-card.total .stat-icon { color:var(--blue); background:var(--blue-soft); }
    .stat-card small { display:block; margin-bottom:3px; color:var(--secondary); font-size:12px; }
    .stat-value { color:var(--text); font-size:27px; font-weight:760; font-variant-numeric:tabular-nums; }
    .stat-suffix { margin-left:2px; color:var(--muted); font-size:12px; font-weight:500; }
    .workspace { display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:22px; align-items:start; }
    .content-column { min-width:0; display:grid; gap:22px; }
    .panel { border:1px solid var(--border); border-radius:20px; background:var(--surface); box-shadow:var(--shadow); overflow:hidden; }
    .panel-head { min-height:65px; padding:16px 19px; display:flex; align-items:center; justify-content:space-between; gap:12px; border-bottom:1px solid #ece8df; }
    .panel-title { display:flex; align-items:center; gap:10px; }
    .panel-title-mark { width:9px; height:9px; border-radius:50%; }
    .schedule-panel .panel-title-mark { background:var(--green); }
    .log-panel .panel-title-mark { background:var(--warm); }
    .panel-title h2 { margin:0; font-size:16px; letter-spacing:-.01em; }
    .count-label { color:var(--muted); font-size:12px; }
    .entries { padding:7px 18px 16px; }
    .entry { padding:15px 2px; display:grid; grid-template-columns:68px minmax(0,1fr) auto; gap:14px; align-items:start; border-bottom:1px solid #efebe3; }
    .entry:last-child { border-bottom:0; }
    .entry-time { padding-top:2px; color:var(--green); font-size:13px; font-weight:750; font-variant-numeric:tabular-nums; }
    .log-panel .entry-time { color:var(--warm); }
    .entry-time.all-day { color:var(--muted); font-weight:650; }
    .entry h3 { margin-bottom:5px; color:var(--text); font-size:14px; line-height:1.45; overflow-wrap:anywhere; }
    .entry p { margin:0; color:var(--secondary); font-size:12px; line-height:1.62; white-space:pre-wrap; overflow-wrap:anywhere; }
    .entry-actions { display:flex; gap:4px; opacity:.35; transition:opacity .15s; }
    .entry:hover .entry-actions,.entry:focus-within .entry-actions { opacity:1; }
    .mini-button { width:31px; height:31px; border-radius:9px; background:transparent; color:var(--secondary); font-size:14px; }
    .mini-button:hover { background:#f2efe8; color:var(--text); }
    .mini-button.delete:hover { background:var(--danger-soft); color:var(--danger); }
    .empty-state { min-height:182px; padding:30px 18px; display:grid; place-items:center; text-align:center; }
    .empty-icon { width:52px; height:52px; margin:0 auto 12px; display:grid; place-items:center; border-radius:18px; color:var(--muted); background:#f4f1eb; font-size:21px; }
    .empty-state strong { display:block; margin-bottom:5px; font-size:14px; }
    .empty-state p { margin-bottom:12px; color:var(--secondary); font-size:12px; }
    .empty-add { padding:7px 11px; border-radius:9px; color:var(--green); background:var(--green-soft); font-size:12px; font-weight:700; }
    .skeleton { height:62px; margin:12px 0; border-radius:12px; background:linear-gradient(90deg,#f3f0e9 25%,#faf8f3 50%,#f3f0e9 75%); background-size:200% 100%; animation:shimmer 1.25s infinite; }
    @keyframes shimmer { to { background-position:-200% 0; } }
    .editor { position:sticky; top:22px; }
    .editor-head { padding:19px 20px 15px; }
    .editor-head h2 { margin-bottom:4px; font-size:17px; }
    .editor-head p { margin:0; color:var(--secondary); font-size:11px; }
    .entry-form { padding:0 20px 20px; display:grid; gap:13px; }
    .type-switch { padding:4px; display:grid; grid-template-columns:1fr 1fr; gap:4px; border-radius:12px; background:#f1eee7; }
    .type-option { position:relative; }
    .type-option input { position:absolute; opacity:0; pointer-events:none; }
    .type-option span { height:36px; display:grid; place-items:center; border-radius:9px; color:var(--secondary); font-size:12px; font-weight:700; cursor:pointer; }
    .type-option input:checked + span { background:var(--surface); color:var(--green); box-shadow:0 3px 12px rgba(62,54,40,.08); }
    .type-option.log input:checked + span { color:var(--warm); }
    .field { display:grid; gap:6px; color:var(--secondary); font-size:11px; font-weight:650; }
    .field input,.field textarea { width:100%; padding:10px 11px; border:1px solid var(--border); border-radius:11px; color:var(--text); background:#fff; font-size:13px; font-weight:500; }
    .field input { height:42px; }
    .field textarea { min-height:82px; resize:vertical; line-height:1.55; }
    .field input::placeholder,.field textarea::placeholder { color:#b4b8b5; }
    .field input:hover,.field textarea:hover { border-color:#c8c1b5; }
    .form-row { display:grid; grid-template-columns:1.1fr .9fr; gap:10px; }
    .form-actions { display:flex; gap:8px; margin-top:2px; }
    .form-actions .primary-button { flex:1; }
    .secondary-button { min-height:42px; padding:0 14px; border:1px solid var(--border); border-radius:12px; color:var(--secondary); background:var(--surface); font-weight:650; }
    .secondary-button:hover { border-color:#bbb5a8; color:var(--text); }
    .form-status { min-height:17px; margin:-3px 0 0; color:var(--green); font-size:11px; line-height:1.45; }
    .form-status.error { color:var(--danger); }
    .privacy-note { margin:0; padding-top:12px; border-top:1px solid #ece8df; color:var(--muted); font-size:10px; line-height:1.5; }
    .preview-panel { padding:18px; }
    .preview-title { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:15px; }
    .preview-title h2 { margin-bottom:4px; font-size:16px; }
    .preview-title p { margin:0; color:var(--secondary); font-size:11px; }
    .preview-tabs { padding:3px; display:flex; gap:3px; border-radius:10px; background:#f1eee7; }
    .preview-tab { padding:6px 9px; border-radius:8px; color:var(--secondary); background:transparent; font-size:10px; font-weight:700; }
    .preview-tab.active { color:var(--text); background:#fff; box-shadow:0 2px 8px rgba(62,54,40,.08); }
    .device-shell { width:min(336px,100%); margin:0 auto; padding:8px; border-radius:18px; background:#353b39; box-shadow:0 16px 34px rgba(39,48,45,.18),inset 0 0 0 1px #555e5a; }
    .device-screen { width:320px; max-width:100%; aspect-ratio:4/3; padding:12px; display:grid; grid-template-rows:37px minmax(0,1fr) 20px; gap:7px; overflow:hidden; border-radius:7px; color:var(--text); background:#f7f3ea; font:12px/1.35 "PingFang SC","Microsoft YaHei",sans-serif; }
    .device-header { display:flex; align-items:center; justify-content:space-between; gap:8px; border-bottom:1px solid #ded8cb; }
    .device-date { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:750; }
    .device-clock { padding:4px 8px; border-radius:8px; color:var(--green); background:var(--green-soft); font-size:15px; font-weight:800; font-variant-numeric:tabular-nums; }
    .device-body { min-height:0; overflow:hidden; }
    .device-overview { height:100%; display:grid; grid-template-columns:1fr 1fr; gap:7px; }
    .device-card { min-width:0; padding:7px; border:1px solid #ded8cb; border-radius:11px; background:white; overflow:hidden; }
    .device-card.warm { background:#fffaf7; }
    .device-card-head { height:20px; display:flex; align-items:flex-start; justify-content:space-between; gap:4px; color:var(--green); font-size:10px; font-weight:750; }
    .device-card.warm .device-card-head { color:var(--warm); }
    .device-card-count { color:var(--muted); font-weight:650; }
    .device-mini-lines { display:grid; gap:1px; }
    .device-mini-line { min-width:0; height:22px; display:grid; grid-template-columns:38px minmax(0,1fr); align-items:center; gap:3px; }
    .device-mini-prefix { overflow:hidden; color:var(--green); font-size:9px; font-weight:750; text-overflow:ellipsis; white-space:nowrap; }
    .device-card.warm .device-mini-prefix { color:var(--warm); }
    .device-mini-title { overflow:hidden; font-size:9px; text-overflow:ellipsis; white-space:nowrap; }
    .device-mini-empty { padding-top:34px; color:var(--muted); font-size:9px; text-align:center; }
    .device-list { display:grid; gap:5px; }
    .device-line { min-width:0; height:27px; padding:0 8px; display:grid; grid-template-columns:46px minmax(0,1fr); align-items:center; gap:5px; border:1px solid #e3ded3; border-radius:8px; background:white; }
    .device-prefix { color:var(--green); font-weight:750; font-variant-numeric:tabular-nums; }
    .device-list.warm .device-prefix { color:var(--warm); }
    .device-line-title { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .device-empty { height:100%; display:grid; place-items:center; color:var(--muted); text-align:center; }
    .device-footer { display:flex; align-items:center; justify-content:space-between; color:var(--secondary); font-size:9px; }
    .device-data-status { display:flex; align-items:center; gap:5px; }
    .device-data-dot { width:6px; height:6px; border-radius:50%; background:var(--muted); }
    .device-footer.ready .device-data-dot { background:var(--green); }
    .device-page-name { color:var(--muted); }
    body[data-view="schedule"] .log-panel,body[data-view="log"] .schedule-panel { display:none; }
    body[data-view="schedule"] .preview-panel,body[data-view="log"] .preview-panel { display:none; }
    dialog { width:min(430px,calc(100% - 30px)); padding:0; border:1px solid var(--border); border-radius:20px; color:var(--text); background:var(--surface); box-shadow:0 28px 80px rgba(39,48,45,.22); }
    dialog::backdrop { background:rgba(39,48,45,.42); backdrop-filter:blur(3px); }
    .dialog-content { padding:23px; }
    .dialog-content h2 { margin-bottom:7px; font-size:18px; }
    .dialog-content>p { margin-bottom:18px; color:var(--secondary); font-size:12px; line-height:1.6; }
    .dialog-actions { margin-top:18px; display:flex; justify-content:flex-end; gap:8px; }
    .dialog-actions button { min-height:40px; padding:0 15px; border-radius:11px; font-weight:700; }
    .danger-button { color:white; background:var(--danger); }
    .danger-button:hover { background:#8f3c34; }
    @media (max-width:1060px) { .app{grid-template-columns:190px minmax(0,1fr)} .sidebar{padding-left:14px;padding-right:14px} .workspace{grid-template-columns:minmax(0,1fr) 310px} }
    @media (max-width:860px) {
      .app{display:block} .sidebar{min-height:0;padding:14px 18px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:18px;border-right:0;border-bottom:1px solid var(--border)}
      .brand small,.nav-label,.sidebar-bottom{display:none}.brand{padding:0}.brand-mark{width:36px;height:36px;border-radius:11px;font-size:18px}.nav{display:flex;justify-content:center}.nav-button{width:auto;min-height:38px;padding:0 11px}.nav-icon,.nav-count{display:none}.main{padding-top:18px}.workspace{grid-template-columns:1fr}.editor{position:static;order:-1}
    }
    @media (max-width:620px) {
      .sidebar{grid-template-columns:1fr;gap:12px}.brand{justify-content:center}.nav-button{flex:1;justify-content:center;font-size:12px}.main{padding:14px 14px 36px}.topbar{align-items:stretch;flex-direction:column}.date-nav{justify-content:space-between}#date{width:100%}.date-input-wrap{flex:1}.primary-button{width:100%}.hero{padding-top:28px;align-items:flex-start;flex-direction:column}.save-note{display:none}.stats{grid-template-columns:1fr 1fr}.stat-card{min-height:92px;padding:14px}.stat-card.total{grid-column:1/-1}.entry{grid-template-columns:52px minmax(0,1fr);gap:9px}.entry-actions{grid-column:2;opacity:1}.preview-title{flex-direction:column}
    }
  </style>
</head>
<body data-view="overview">
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">智</span><div><strong>小智日程</strong><small>把每一天安排清楚</small></div></div>
      <div class="nav-label">查看</div>
      <nav class="nav" aria-label="内容视图">
        <button class="nav-button active" id="viewOverview" data-view="overview" aria-current="page"><span class="nav-icon">⌂</span><span>今日总览</span></button>
        <button class="nav-button" id="viewSchedule" data-view="schedule"><span class="nav-icon">□</span><span>日程安排</span><span class="nav-count" id="navScheduleCount">0</span></button>
        <button class="nav-button" id="viewLog" data-view="log"><span class="nav-icon">✓</span><span>工作记录</span><span class="nav-count" id="navLogCount">0</span></button>
      </nav>
      <div class="sidebar-bottom">
        <div class="connection-card" id="connectionCard"><div class="connection-line"><span class="connection-dot"></span><span id="connectionTitle">正在读取</span></div><p id="connectionDetail">请稍候，正在准备当天内容</p></div>
      </div>
    </aside>
    <main class="main">
      <div class="topbar">
        <div class="date-nav" aria-label="选择日期"><button class="icon-button" id="prev" type="button" title="前一天" aria-label="前一天">‹</button><div class="date-input-wrap"><input id="date" type="date" aria-label="日期"></div><button class="icon-button" id="next" type="button" title="后一天" aria-label="后一天">›</button><button class="today-button" id="today" type="button">回到今天</button><button class="today-button" id="refreshButton" type="button" title="读取语音、USB 和网页端的最新内容">刷新</button></div>
        <button class="primary-button" id="newEntry" type="button"><span class="plus">＋</span>新增记录</button>
      </div>
      <section class="hero"><div><div class="eyebrow" id="dateEyebrow">今天</div><h1 id="dateHeading">今天过得怎么样？</h1><p id="dateSubheading">安排要做的事，也记下已经完成的工作。</p></div><div class="save-note" id="saveNote" title="数据保存在这台电脑上"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m3 8.2 3 3L13 4.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>内容保存在这台电脑上</span></div></section>
      <div class="notice" id="pageNotice" role="status" aria-live="polite"><div class="notice-inner"><span id="noticeIcon"></span><span class="notice-message" id="noticeMessage"></span><button class="retry-button" id="retry" type="button" hidden>重新读取</button></div></div>
      <section class="stats" aria-label="当天记录数量">
        <div class="stat-card schedule"><span class="stat-icon">□</span><div><small>日程安排</small><span class="stat-value" id="scheduleStat">0</span><span class="stat-suffix">项</span></div></div>
        <div class="stat-card log"><span class="stat-icon">✓</span><div><small>工作记录</small><span class="stat-value" id="logStat">0</span><span class="stat-suffix">项</span></div></div>
        <div class="stat-card total"><span class="stat-icon">◎</span><div><small>当天记录</small><span class="stat-value" id="totalStat">0</span><span class="stat-suffix">项</span></div></div>
      </section>
      <div class="workspace">
        <div class="content-column">
          <section class="panel schedule-panel" aria-labelledby="scheduleHeading"><div class="panel-head"><div class="panel-title"><span class="panel-title-mark"></span><h2 id="scheduleHeading">日程安排</h2></div><span class="count-label" id="scheduleCount">0 项</span></div><div class="entries" id="schedules"></div></section>
          <section class="panel log-panel" aria-labelledby="logHeading"><div class="panel-head"><div class="panel-title"><span class="panel-title-mark"></span><h2 id="logHeading">工作记录</h2></div><span class="count-label" id="logCount">0 项</span></div><div class="entries" id="logs"></div></section>
          <section class="panel preview-panel" aria-labelledby="previewHeading">
            <div class="preview-title"><div><h2 id="previewHeading">小智屏幕预览</h2><p>320 × 240 界面示例，使用当前日期的内容</p></div><div class="preview-tabs" aria-label="预览页面"><button class="preview-tab active" data-preview="overview" type="button">概览</button><button class="preview-tab" data-preview="schedule" type="button">日程</button><button class="preview-tab" data-preview="log" type="button">工作</button></div></div>
            <div class="device-shell"><div class="device-screen" aria-label="小智设备界面预览"><div class="device-header"><span class="device-date" id="mockDate">日期待读取</span><span class="device-clock" id="mockClock">--:--</span></div><div class="device-body" id="deviceBody"></div><div class="device-footer" id="mockFooter"><span class="device-data-status"><span class="device-data-dot"></span><span id="mockStatus">正在读取电脑数据</span></span><span class="device-page-name" id="devicePageName">今日概览</span></div></div></div>
          </section>
        </div>
        <aside class="panel editor" id="editor">
          <div class="editor-head"><h2 id="formHeading">新增记录</h2><p id="formHint">安排接下来要做的事，或记下工作进展。</p></div>
          <form class="entry-form" id="entryForm">
            <input id="entryId" type="hidden">
            <div class="type-switch" role="radiogroup" aria-label="记录类型"><label class="type-option"><input id="typeSchedule" type="radio" name="entryType" value="schedule" checked><span>日程安排</span></label><label class="type-option log"><input id="typeLog" type="radio" name="entryType" value="log"><span>工作记录</span></label></div>
            <div class="form-row"><label class="field">日期<input id="entryDate" type="date" required></label><label class="field">时间（可不填）<input id="time" type="time"></label></div>
            <label class="field">标题<input id="title" maxlength="200" placeholder="例如：和项目组开会" required></label>
            <label class="field">补充内容（可不填）<textarea id="content" maxlength="10000" placeholder="写下地点、准备事项或完成情况…"></textarea></label>
            <div class="form-actions"><button class="primary-button" id="save" type="submit">保存记录</button><button class="secondary-button" id="cancel" type="button" hidden>取消</button></div>
            <p class="form-status" id="status" role="status" aria-live="polite"></p><p class="privacy-note">保存后会出现在所选日期中，并保留在这台电脑上。</p>
          </form>
        </aside>
      </div>
    </main>
  </div>
  <dialog id="deleteDialog"><form method="dialog" id="deleteForm" class="dialog-content"><h2>删除这条记录？</h2><p>“<span id="deleteTitle"></span>”删除后将不再出现在当天内容中。</p><div class="dialog-actions"><button class="secondary-button" value="cancel">保留</button><button class="danger-button" id="confirmDelete" value="delete">删除</button></div></form></dialog>
  <script>
    const $ = id => document.getElementById(id);
    let model = { date:'', schedules:[], work_logs:[], counts:{schedules:0,work_logs:0}, truncated:{} };
    let dataState='loading', currentPreview='overview', deleteTarget=null, pendingCreate=null;
    let activeLoad=null, pendingLoad=null, mutationInFlight=false, formDirty=false;
    const escapeHtml = value => String(value ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const two = value => String(value).padStart(2,'0');
    const localIsoDate = () => { const d=new Date(); return `${d.getFullYear()}-${two(d.getMonth()+1)}-${two(d.getDate())}`; };
    const createRequestId = () => crypto.randomUUID ? `web-${crypto.randomUUID()}` : `web-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    const selectedType = () => document.querySelector('input[name="entryType"]:checked').value;
    const allEntries = () => [...model.schedules,...model.work_logs];
    function friendlyError(error) {
      if(error.status===401)return '本地服务仍在使用旧的访问设置。请关闭并重新启动小智工具，然后刷新页面。';
      if(error.status===404)return '这条记录已经不存在，请重新读取。';
      if(error.status===409)return '这次保存与先前内容不一致，请稍后再试。';
      if(error.status>=500)return '暂时无法完成操作，请稍后再试。';
      if(error.status)return '内容未能保存，请检查填写内容。';
      return '无法连接到本地日程，请确认小智工具正在运行。';
    }
    async function api(path,options={}) {
      let response;
      try { response=await fetch(path,{...options,headers:{...(options.body?{'Content-Type':'application/json'}:{}),...(options.headers||{})}}); }
      catch(cause){ const error=new Error('network');error.cause=cause;throw error; }
      if(response.status===204)return null;
      let payload={}; try{payload=await response.json();}catch{}
      if(!response.ok){ const error=new Error(payload.error?.message||`HTTP ${response.status}`);error.status=response.status;error.code=payload.error?.code;throw error; }
      return payload;
    }
    function formatDate(iso,options){const d=new Date(`${iso}T12:00:00`);return !iso||Number.isNaN(d.getTime())?'':new Intl.DateTimeFormat('zh-CN',options).format(d);}
    function updateDateHeading(){
      const selected=$('date').value,today=localIsoDate(),yd=new Date(`${today}T12:00:00`),td=new Date(`${today}T12:00:00`);yd.setDate(yd.getDate()-1);td.setDate(td.getDate()+1);
      const iso=d=>`${d.getFullYear()}-${two(d.getMonth()+1)}-${two(d.getDate())}`;
      $('dateEyebrow').textContent=selected===today?'今天':selected===iso(yd)?'昨天':selected===iso(td)?'明天':'所选日期';
      $('dateHeading').textContent=formatDate(selected,{month:'long',day:'numeric',weekday:'long'})||'选择一天';
      $('dateSubheading').textContent=selected===today?'安排要做的事，也记下已经完成的工作。':'查看这一天的安排和工作记录。';
    }
    function setNotice(kind='',message=''){const n=$('pageNotice');n.className=`notice${kind?` visible ${kind}`:''}`;$('noticeMessage').textContent=message;$('noticeIcon').innerHTML=kind==='loading'?'<span class="spinner"></span>':kind==='success'?'✓':kind==='error'?'!':'';$('retry').hidden=kind!=='error';}
    function setFormStatus(message='',error=false){$('status').textContent=message;$('status').classList.toggle('error',error);}
    function setConnection(state){const card=$('connectionCard');card.className=`connection-card ${state==='ready'?'ready':state==='error'?'error':''}`;$('connectionTitle').textContent=state==='ready'?'电脑数据可用':state==='error'?'暂时无法读取':'正在读取';$('connectionDetail').textContent=state==='ready'?'当天内容已载入，可以继续编辑':state==='error'?'请确认小智工具正在运行':'请稍候，正在准备当天内容';}
    function datePrefix(entry){return String(entry.date||model.date||'').slice(5).replace('-','/')||'日期';}
    function entryHtml(entry,type){const prefix=type==='schedule'?(entry.time||'全天'):datePrefix(entry);return `<article class="entry" data-id="${Number(entry.id)}"><div class="entry-time${type==='schedule'&&!entry.time?' all-day':''}">${escapeHtml(prefix)}</div><div class="entry-copy"><h3>${escapeHtml(entry.title)}</h3>${entry.content?`<p>${escapeHtml(entry.content)}</p>`:''}</div><div class="entry-actions"><button class="mini-button edit" type="button" aria-label="编辑 ${escapeHtml(entry.title)}" title="编辑">✎</button><button class="mini-button delete" type="button" aria-label="删除 ${escapeHtml(entry.title)}" title="删除">×</button></div></article>`;}
    function renderList(target,entries,type){
      const container=$(target);
      if(dataState==='loading'){container.innerHTML='<div class="skeleton"></div><div class="skeleton"></div>';return;}
      if(dataState==='error'){container.innerHTML='<div class="empty-state"><div><div class="empty-icon">…</div><strong>暂时无法显示</strong><p>重新读取后会在这里显示当天内容</p></div></div>';return;}
      if(!entries.length){const label=type==='schedule'?'日程':'工作记录';container.innerHTML=`<div class="empty-state"><div><div class="empty-icon">${type==='schedule'?'□':'✓'}</div><strong>这一天还没有${label}</strong><p>${type==='schedule'?'添加第一项安排，让一天更有条理。':'记下完成的工作，方便之后回顾。'}</p><button class="empty-add" data-add-type="${type}" type="button">添加${label}</button></div></div>`;return;}
      container.innerHTML=entries.map(e=>entryHtml(e,type)).join('');
    }
    function renderPreview(){
      const ready=dataState==='ready';$('mockDate').textContent=formatDate(model.date||$('date').value,{month:'2-digit',day:'2-digit',weekday:'short'})||'日期待读取';$('mockFooter').classList.toggle('ready',ready);$('mockStatus').textContent=ready?'电脑数据可用':dataState==='loading'?'正在读取电脑数据':'暂时无法读取电脑数据';$('devicePageName').textContent={overview:'今日概览',schedule:'日程安排',log:'工作记录'}[currentPreview];
      if(!ready){$('deviceBody').innerHTML=`<div class="device-empty">${dataState==='loading'?'正在准备当天内容…':'内容暂时无法显示'}</div>`;return;}
      if(currentPreview==='overview'){
        const miniLines=(entries,type)=>entries.length?`<div class="device-mini-lines">${entries.slice(0,4).map(e=>`<div class="device-mini-line"><span class="device-mini-prefix">${escapeHtml(type==='schedule'?(e.time||'全天'):datePrefix(e))}</span><span class="device-mini-title">${escapeHtml(e.title)}</span></div>`).join('')}</div>`:`<div class="device-mini-empty">${type==='schedule'?'今天没有安排':'还没有工作记录'}</div>`;
        $('deviceBody').innerHTML=`<div class="device-overview"><div class="device-card"><div class="device-card-head"><span>今日日程</span><span class="device-card-count">${model.counts.schedules}</span></div>${miniLines(model.schedules,'schedule')}</div><div class="device-card warm"><div class="device-card-head"><span>工作记录</span><span class="device-card-count">${model.counts.work_logs}</span></div>${miniLines(model.work_logs,'log')}</div></div>`;return;
      }
      const entries=currentPreview==='schedule'?model.schedules:model.work_logs;if(!entries.length){$('deviceBody').innerHTML=`<div class="device-empty">${currentPreview==='schedule'?'今天没有安排':'今天还没有工作记录'}</div>`;return;}
      $('deviceBody').innerHTML=`<div class="device-list${currentPreview==='log'?' warm':''}">${entries.slice(0,4).map(e=>`<div class="device-line"><span class="device-prefix">${escapeHtml(currentPreview==='schedule'?(e.time||'全天'):datePrefix(e))}</span><span class="device-line-title">${escapeHtml(e.title)}</span></div>`).join('')}</div>`;
    }
    function render(){const s=model.counts?.schedules??model.schedules.length,l=model.counts?.work_logs??model.work_logs.length;renderList('schedules',model.schedules,'schedule');renderList('logs',model.work_logs,'log');$('scheduleStat').textContent=s;$('logStat').textContent=l;$('totalStat').textContent=s+l;$('scheduleCount').textContent=`${s} 项`;$('logCount').textContent=`${l} 项`;$('navScheduleCount').textContent=s;$('navLogCount').textContent=l;updateDateHeading();renderPreview();}
    function requestIsCurrent(request){return $('date').value===request.selectedDate;}
    async function performLoad(request){
      const keepVisible=request.background&&dataState==='ready';
      if(!keepVisible){dataState='loading';setConnection('loading');setNotice('loading',request.successMessage?'正在刷新当天内容…':'正在读取当天内容…');render();}
      const query=request.serverDate?'':`date=${encodeURIComponent(request.selectedDate)}&`;
      try{
        const incoming=await api(`/api/dashboard?${query}limit=100&content_limit=10000`);
        if(request.serverDate){
          if(!requestIsCurrent(request)||formDirty||$('entryForm').contains(document.activeElement)){
            pendingLoad={selectedDate:$('date').value};
            return false;
          }
          $('date').value=incoming.date;
          resetForm();
        }else if(!requestIsCurrent(request))return false;
        model=incoming;dataState='ready';setConnection('ready');setNotice(request.successMessage?'success':'',request.successMessage||'');render();
        if(request.successMessage)window.setTimeout(()=>{if(dataState==='ready')setNotice();},2600);
        return true;
      }catch(error){
        if(!request.serverDate&&!requestIsCurrent(request))return false;
        if(!keepVisible){dataState='error';render();}
        setConnection('error');setNotice('error',friendlyError(error));return false;
      }
    }
    function startLoad(request){
      activeLoad=performLoad(request).finally(()=>{
        activeLoad=null;
        if(pendingLoad&&!mutationInFlight){const next=pendingLoad;pendingLoad=null;startLoad(next);}
      });
      return activeLoad;
    }
    function load(options={}){
      const request={...options,selectedDate:$('date').value};
      if(activeLoad||mutationInFlight){if(!options.background)pendingLoad=request;return activeLoad||Promise.resolve(false);}
      return startLoad(request);
    }
    async function waitForActiveLoad(){if(activeLoad){try{await activeLoad;}catch{}}}
    function finishMutation(refreshPending=true){
      mutationInFlight=false;
      const next=pendingLoad;pendingLoad=null;
      if(refreshPending&&next)startLoad(next);
    }
    function resetForm(preferredType){$('entryForm').reset();$('entryId').value='';$('entryDate').value=$('date').value||model.date||localIsoDate();$(preferredType==='log'?'typeLog':'typeSchedule').checked=true;$('formHeading').textContent='新增记录';$('formHint').textContent='安排接下来要做的事，或记下工作进展。';$('save').textContent='保存记录';$('cancel').hidden=true;pendingCreate=null;formDirty=false;setFormStatus();}
    function openEditor(type='schedule'){if(!$('entryId').value)$(type==='log'?'typeLog':'typeSchedule').checked=true;$('editor').scrollIntoView({behavior:'smooth',block:'start'});window.setTimeout(()=>$('title').focus(),250);}
    function changeDay(offset){const d=new Date(`${$('date').value}T12:00:00`);if(Number.isNaN(d.getTime()))return;d.setDate(d.getDate()+offset);$('date').value=`${d.getFullYear()}-${two(d.getMonth()+1)}-${two(d.getDate())}`;resetForm();load();}
    function updateMockClock(){const now=new Date();$('mockClock').textContent=`${two(now.getHours())}:${two(now.getMinutes())}`;}
    function switchView(view){document.body.dataset.view=view;document.querySelectorAll('.nav-button').forEach(b=>{const active=b.dataset.view===view;b.classList.toggle('active',active);if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});}
    $('entryForm').addEventListener('submit',async event=>{
      event.preventDefault();if(mutationInFlight)return;const id=$('entryId').value;const payload={type:selectedType(),date:$('entryDate').value,time:$('time').value||null,title:$('title').value,content:$('content').value};
      if(!id){const fingerprint=JSON.stringify(payload);if(!pendingCreate||pendingCreate.fingerprint!==fingerprint)pendingCreate={fingerprint,requestId:createRequestId()};payload.request_id=pendingCreate.requestId;}
      mutationInFlight=true;$('save').disabled=true;$('cancel').disabled=true;setFormStatus(id?'正在更新…':'正在保存…');
      try{await waitForActiveLoad();await api(id?`/api/entries/${id}`:'/api/entries',{method:id?'PATCH':'POST',body:JSON.stringify(payload)});pendingCreate=null;resetForm();finishMutation(false);await load({successMessage:id?'记录已更新，并保存在这台电脑上。':'记录已添加，并保存在这台电脑上。'});}
      catch(error){setFormStatus(friendlyError(error),true);}finally{if(mutationInFlight)finishMutation();$('save').disabled=false;$('cancel').disabled=false;}
    });
    $('entryForm').addEventListener('input',()=>{formDirty=true;});
    $('entryForm').addEventListener('change',()=>{formDirty=true;});
    document.addEventListener('click',event=>{
      const view=event.target.closest('.nav-button');if(view){switchView(view.dataset.view);return;}
      const preview=event.target.closest('.preview-tab');if(preview){currentPreview=preview.dataset.preview;document.querySelectorAll('.preview-tab').forEach(b=>b.classList.toggle('active',b===preview));renderPreview();return;}
      const add=event.target.closest('[data-add-type]');if(add){resetForm(add.dataset.addType);openEditor(add.dataset.addType);return;}
      const card=event.target.closest('.entry');if(!card)return;const entry=allEntries().find(item=>Number(item.id)===Number(card.dataset.id));if(!entry)return;
      if(event.target.closest('.edit')){$('entryId').value=entry.id;$(entry.type==='log'?'typeLog':'typeSchedule').checked=true;$('entryDate').value=entry.date;$('time').value=entry.time||'';$('title').value=entry.title;$('content').value=entry.content||'';$('formHeading').textContent='编辑记录';$('formHint').textContent='修改后保存，原记录会立即更新。';$('save').textContent='保存修改';$('cancel').hidden=false;pendingCreate=null;formDirty=false;setFormStatus();openEditor(entry.type);}
      if(event.target.closest('.delete')){deleteTarget=entry;$('deleteTitle').textContent=entry.title;$('deleteDialog').showModal();}
    });
    $('deleteForm').addEventListener('submit',async event=>{
      if(event.submitter?.value!=='delete'||!deleteTarget)return;event.preventDefault();if(mutationInFlight)return;const entry=deleteTarget;mutationInFlight=true;$('confirmDelete').disabled=true;
      try{await waitForActiveLoad();await api(`/api/entries/${entry.id}`,{method:'DELETE'});$('deleteDialog').close();deleteTarget=null;if(Number($('entryId').value)===Number(entry.id))resetForm();finishMutation(false);await load({successMessage:'记录已删除。'});}
      catch(error){$('deleteDialog').close();setNotice('error',friendlyError(error));}finally{if(mutationInFlight)finishMutation();$('confirmDelete').disabled=false;}
    });
    $('prev').onclick=()=>changeDay(-1);$('next').onclick=()=>changeDay(1);$('today').onclick=()=>{$('date').value=localIsoDate();resetForm();load();};$('date').onchange=()=>{resetForm();load();};
    $('newEntry').onclick=()=>{const type=document.body.dataset.view==='log'?'log':'schedule';resetForm(type);openEditor(type);};$('cancel').onclick=()=>resetForm();$('retry').onclick=()=>load();
    $('refreshButton').onclick=()=>load({successMessage:'已读取最新内容。'});
    $('date').value=localIsoDate();resetForm();updateMockClock();render();load({serverDate:true});window.setInterval(updateMockClock,30000);window.setInterval(()=>load({background:true}),5000);
  </script>
</body>
