<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>320×240 Dashboard preview</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #08131f;
      --surface: #102331;
      --border: #1d3a47;
      --primary: #e7eef3;
      --secondary: #8ea5b3;
      --muted: #6f8794;
      --teal: #2dd4bf;
      --teal-surface: #143439;
      --warm: #f2b56b;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      background: #050b11;
      color: var(--primary);
      font-family: "Noto Sans SC", "Microsoft YaHei", "PingFang SC", sans-serif;
    }

    main {
      display: flex;
      gap: 28px;
      padding: 28px;
    }

    figure {
      margin: 0;
    }

    figcaption {
      margin-bottom: 9px;
      color: #8ea5b3;
      font-size: 12px;
      letter-spacing: .08em;
    }

    .screen {
      display: grid;
      grid-template-rows: 42px minmax(0, 1fr) 20px;
      gap: 6px;
      width: 320px;
      height: 240px;
      padding: 8px;
      overflow: hidden;
      background: var(--background);
      font-size: 16px;
      line-height: 20px;
      -webkit-font-smoothing: none;
      font-synthesis: none;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-width: 0;
    }

    .date-group {
      display: flex;
      flex: 1;
      align-items: center;
      min-width: 0;
      height: 100%;
      gap: 8px;
    }

    .date-rail {
      flex: 0 0 3px;
      width: 3px;
      height: 28px;
      border-radius: 99px;
      background: var(--teal);
    }

    .date {
      overflow: hidden;
      color: var(--primary);
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .clock {
      display: grid;
      place-items: center;
      flex: 0 0 82px;
      width: 82px;
      height: 36px;
      border: 1px solid #23605f;
      border-radius: 9px;
      background: var(--teal-surface);
      color: #f4f7f9;
      font-size: 20px;
      letter-spacing: 1px;
    }

    .cards {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 6px;
      min-height: 0;
    }

    .card {
      display: grid;
      grid-template-rows: 22px repeat(4, 22px);
      align-content: start;
      gap: 3px;
      min-width: 0;
      padding: 7px;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-width: 0;
    }

    .schedule .card-head,
    .schedule .prefix {
      color: var(--teal);
    }

    .logs .card-head,
    .logs .prefix {
      color: var(--warm);
    }

    .count {
      color: var(--secondary);
    }

    .data-row {
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr);
      align-items: center;
      gap: 5px;
      min-width: 0;
      height: 22px;
    }

    .prefix,
    .title {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .title {
      color: var(--primary);
    }

    .empty-card {
      grid-template-rows: 22px 1fr;
    }

    .empty {
      align-self: center;
      padding: 0 4px 17px;
      color: var(--muted);
      text-align: center;
      line-height: 22px;
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      min-width: 0;
      color: var(--secondary);
    }

    .status-dot {
      flex: 0 0 6px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--teal);
    }

    .status {
      max-width: 78%;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .offline .status-dot {
      background: var(--warm);
    }
  </style>
</head>
<body>
  <main aria-label="Dashboard firmware states">
    <figure>
      <figcaption>USB 已连接 · 代表数据</figcaption>
      <section class="screen" aria-label="已连接的仪表盘">
        <header class="header">
          <div class="date-group">
            <span class="date-rail" aria-hidden="true"></span>
            <span class="date">10月06日 周二</span>
          </div>
          <time class="clock">08:42</time>
        </header>

        <div class="cards">
          <section class="card schedule">
            <header class="card-head"><span>今日日程</span><span class="count">4</span></header>
            <div class="data-row"><time class="prefix">09:00</time><span class="title">站会</span></div>
            <div class="data-row"><time class="prefix">11:30</time><span class="title">评审</span></div>
            <div class="data-row"><time class="prefix">15:00</time><span class="title">客户会</span></div>
            <div class="data-row"><span class="prefix">全天</span><span class="title">发布</span></div>
          </section>

          <section class="card logs">
            <header class="card-head"><span>工作记录</span><span class="count">4</span></header>
            <div class="data-row"><time class="prefix">10/06</time><span class="title">周报</span></div>
            <div class="data-row"><time class="prefix">10/06</time><span class="title">原型</span></div>
            <div class="data-row"><time class="prefix">10/06</time><span class="title">回归</span></div>
            <div class="data-row"><time class="prefix">10/06</time><span class="title">文档</span></div>
          </section>
        </div>

        <footer class="footer"><span class="status-dot" aria-hidden="true"></span><span class="status">USB 已连接</span></footer>
      </section>
    </figure>

    <figure>
      <figcaption>电脑未连接 · 首次同步</figcaption>
      <section class="screen offline" aria-label="未连接的仪表盘">
        <header class="header">
          <div class="date-group">
            <span class="date-rail" aria-hidden="true"></span>
            <span class="date">10月06日 周二</span>
          </div>
          <time class="clock">08:42</time>
        </header>

        <div class="cards">
          <section class="card schedule empty-card">
            <header class="card-head"><span>今日日程</span><span class="count">0</span></header>
            <div class="empty">等待日程同步</div>
          </section>

          <section class="card logs empty-card">
            <header class="card-head"><span>工作记录</span><span class="count">0</span></header>
            <div class="empty">等待工作记录同步</div>
          </section>
        </div>

        <footer class="footer"><span class="status-dot" aria-hidden="true"></span><span class="status">连接电脑以同步</span></footer>
      </section>
    </figure>
  </main>
</body>
</html>
